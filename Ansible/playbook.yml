
---
- name: Deploy Elevance CI/CD website
  hosts: web
  connection: local
  gather_facts: false

  tasks:
    - name: Pull latest Docker image
      ansible.builtin.command:
        cmd: docker pull himanshu12107/devops-project:latest

    - name: Remove existing website container
      ansible.builtin.command:
        cmd: docker rm -f devops-container
      register: remove_result
      failed_when: false
      changed_when: remove_result.rc == 0

    - name: Start updated website container
      ansible.builtin.command:
        cmd: docker run -d --restart unless-stopped --name devops-container -p 80:80 himanshu12107/devops-project:latest
